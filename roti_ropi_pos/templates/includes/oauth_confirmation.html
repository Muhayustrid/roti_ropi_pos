<div class="portal-container">
	<div class="portal-section">
		<p>{{ _("{0} wants to access the following details from your account").format(client_id) }}</p>
	</div>
	<div class="portal-items">
		{% for detail in details %}
		<div class="portal-section">
			{{ _(detail) }}
		</div>
		{% endfor %}
	</div>
	<div class="portal-section">
		<div class="action-buttons" style="display: flex; flex-direction: row-reverse; width: 100%;">
			<form method="POST" action="{{ success_url | string }}">
				<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
				<button type="submit" class="btn btn-sm btn-primary">{{ _("Allow") }}</button>
			</form>
			<a href="{{ failure_url | string }}" class="btn btn-sm btn-light mr-3">{{ _("Deny") }}</a>
			<a href="/logout" id="mobile-pos-switch-account" class="btn btn-sm btn-light mr-3">{{ _("Switch account") }}</a>
		</div>
	</div>
</div>
<script>
	document.getElementById("mobile-pos-switch-account").addEventListener("click", function () {
		sessionStorage.setItem("mobile_pos_oauth_authorize_url", window.location.href);
	});
</script>
